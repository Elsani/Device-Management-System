name: CI/CD Pipeline - Device Management System

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # 1. Testimi dhe Verifikimi i Backend-it (Spring Boot / Java 21)
  # -------------------------------------------------------------
  backend-ci:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        working-directory: ./backend
        run: mvn clean package -DskipTests

  # -------------------------------------------------------------
  # 2. Testimi dhe Verifikimi i Frontend-it (React / TypeScript)
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Compile TypeScript & Build
        working-directory: ./frontend
        run: npm run build

  # -------------------------------------------------------------
  # 3. Verifikimi i Imazheve të Docker (Docker Compose Build)
  # -------------------------------------------------------------
  docker-ci:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Stack
        run: docker compose build
