server {
    listen 80;
    server_name localhost;

    # Dosja ku ndodhet kodi i kompiluar i React (HTML/JS/CSS)
    root /usr/share/nginx/html;
    index index.html;

    # Mbështetje për Single Page Applications (SPA / React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy për të gjitha thirrjet API drejt Backend-it Spring Boot
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip Compression për shpejtësi maksimale të ngarkimit
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
